# PoC probe for the Windows self-hosted runner ov-dmz-37.
# Confirms the runner works and reports GPU + toolchain, so we can decide if the
# real upstream Windows Vulkan CI (MSYS2-based) can run here.
# Deploy via GitHub web UI to .github/workflows/poc-windows-ov-dmz-37.yml on main
# (do NOT push from the local clone while the proxy commit e21fdde is held).
name: PoC Windows probe (ov-dmz-37)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-windows-ov-dmz-37.yml'

permissions:
  contents: read

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1
  NODE_USE_SYSTEM_CA: 1
  MINGIT_URL: https://github.com/git-for-windows/git/releases/download/v2.47.1.windows.1/MinGit-2.47.1-64-bit.zip
  HTTPS_PROXY: http://proxy-dmz.intel.com:912

jobs:
  windows-probe:
    runs-on: [self-hosted, X64, Windows, ov-dmz-37]

    steps:
      - name: Host + OS
        shell: powershell
        run: |
          Write-Host "Host: $env:COMPUTERNAME"
          (Get-CimInstance Win32_OperatingSystem).Caption
          (Get-CimInstance Win32_OperatingSystem).Version

      - name: GPUs
        shell: powershell
        run: |
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion, AdapterRAM |
            Format-Table -AutoSize

      - name: Toolchain availability
        shell: powershell
        run: |
          $checks = @(
            "C:\msys64\usr\bin\bash.exe",   # MSYS2 (needed for upstream Windows CI)
            "vulkaninfo",
            "cmake",
            "git",
            "ninja",
            "python"
          )
          foreach ($t in $checks) {
            $cmd = Get-Command $t -ErrorAction SilentlyContinue
            if     ($cmd)            { Write-Host ("FOUND  : {0} -> {1}" -f $t, $cmd.Source) }
            elseif (Test-Path $t)    { Write-Host ("FOUND  : {0} (path exists)" -f $t) }
            else                     { Write-Host ("MISSING: {0}" -f $t) }
          }

      - name: vulkaninfo (if present)
        shell: powershell
        run: |
          if (Get-Command vulkaninfo -ErrorAction SilentlyContinue) {
            vulkaninfo --summary
          } else {
            Write-Host "vulkaninfo not on PATH - Vulkan SDK/runtime likely not installed yet"
          }

      # actions/checkout needs a native Windows git (MSYS2 git breaks on Windows paths).
      - name: Ensure native Windows git on PATH
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "C:\Program Files\Git\cmd",
            "C:\Program Files (x86)\Git\cmd",
            "C:\tools\mingit\cmd"
          )
          $gitDir = $null
          foreach ($d in $candidates) {
            if (Test-Path (Join-Path $d 'git.exe')) { $gitDir = $d; break }
          }
          if (-not $gitDir) {
            Write-Host "Native Windows git not found - downloading portable MinGit"
            $dest = "C:\tools\mingit"
            if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'mingit.zip'
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri $env:MINGIT_URL -OutFile $zip -UseBasicParsing
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $dest)
            $gitDir = Join-Path $dest 'cmd'
          }
          $git = Join-Path $gitDir 'git.exe'
          Write-Host "Using native Windows git: $git"
          & $git --version

          & $git config --global core.longpaths true
          & $git config --global http.sslBackend schannel

          $proxy = $env:HTTPS_PROXY; if (-not $proxy) { $proxy = $env:https_proxy }
          if ($proxy) {
            Write-Host "Configuring git proxy: $proxy"
            & $git config --global http.proxy $proxy
          } else {
            Write-Host "No HTTPS_PROXY in environment"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $gitDir

      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # MSYS2's OpenSSL does not use the Windows cert store, so it rejects the
      # corporate/DMZ TLS-inspection root CA. Export the Windows-trusted roots
      # into MSYS2's trust anchors (both the MSYS and MINGW64 trust stores).
      - name: Export Windows root CAs for MSYS2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $seen = @{}
          $sb = New-Object System.Text.StringBuilder
          foreach ($store in 'Cert:\LocalMachine\Root', 'Cert:\CurrentUser\Root') {
            foreach ($c in Get-ChildItem $store) {
              if ($seen.ContainsKey($c.Thumbprint)) { continue }
              $seen[$c.Thumbprint] = $true
              [void]$sb.AppendLine('-----BEGIN CERTIFICATE-----')
              [void]$sb.AppendLine([Convert]::ToBase64String($c.RawData, 'InsertLineBreaks'))
              [void]$sb.AppendLine('-----END CERTIFICATE-----')
            }
          }
          Write-Host "Exported $($seen.Count) root certificates"
          foreach ($dir in 'C:\msys64\etc\pki\ca-trust\source\anchors',
                           'C:\msys64\mingw64\etc\pki\ca-trust\source\anchors') {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            [IO.File]::WriteAllText((Join-Path $dir 'windows-root-cas.pem'), $sb.ToString(), (New-Object Text.ASCIIEncoding))
          }

      # SKIP MSYS2 PACKAGE INSTALLATION FOR NOW - RUN DETECTION FIRST
      # This step is commented out to allow the workflow to continue and identify
      # which packages are actually missing at runtime. Uncomment and add packages as needed.
      #
      # - name: Install MSYS2 build dependencies
      #   shell: C:\msys64\usr\bin\bash.exe -e {0}
      #   env:
      #     MSYSTEM: MINGW64
      #     CHERE_INVOKING: 1
      #     http_proxy: http://proxy-dmz.intel.com:912
      #     https_proxy: http://proxy-dmz.intel.com:912
      #   run: |
      #     export PATH="/mingw64/bin:/usr/bin:$PATH"
      #     /usr/bin/update-ca-trust
      #     pacman -S --needed --noconfirm \
      #       git wget unzip bc \
      #       mingw-w64-x86_64-git-lfs \
      #       mingw-w64-x86_64-toolchain \
      #       mingw-w64-x86_64-cmake \
      #       mingw-w64-x86_64-ninja \
      #       mingw-w64-x86_64-ccache \
      #       mingw-w64-x86_64-python \
      #       mingw-w64-x86_64-python-pip \
      #       mingw-w64-x86_64-vulkan-devel \
      #       mingw-w64-x86_64-shaderc
      #     if [ -x /mingw64/bin/update-ca-trust ]; then /mingw64/bin/update-ca-trust; fi
      #     git lfs install

      - name: Check available tools and dependencies
        id: check-deps
        shell: C:\msys64\usr\bin\bash.exe -e {0}
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
        run: |
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          echo "=== MSYS2 Environment Check ==="
          echo "MSYSTEM: $MSYSTEM"
          echo "PATH: $PATH"
          echo ""
          echo "=== Checking for required tools ==="
          
          # Array of tools to check (from gg_check_build_requirements)
          tools=(
            "bash"
            "git"
            "git-lfs"
            "wget"
            "python3"
            "pip3"
            "cmake"
            "ctest"
            "unzip"
            "ninja"
            "gcc"
            "glslc"
            "ccache"
          )
          
          missing_tools=()
          for tool in "${tools[@]}"; do
            if command -v "$tool" &> /dev/null; then
              version=$("$tool" --version 2>&1 | head -n1)
              echo "✓ FOUND   : $tool -> $version"
            else
              echo "✗ MISSING: $tool"
              missing_tools+=("$tool")
            fi
          done
          
          echo ""
          echo "=== Check Vulkan ==="
          if command -v vulkaninfo &> /dev/null; then
            echo "✓ FOUND   : vulkaninfo"
            vulkaninfo --summary 2>&1 | head -n10 || echo "  (vulkaninfo summary failed)"
          else
            echo "✗ MISSING: vulkaninfo"
            missing_tools+=("vulkaninfo")
          fi
          
          echo ""
          echo "=== Summary ==="
          if [ ${#missing_tools[@]} -eq 0 ]; then
            echo "All required tools are available!"
            exit 0
          else
            echo "Missing packages that need to be installed:"
            for tool in "${missing_tools[@]}"; do
              echo "  - $tool"
            done
            exit 1
          fi

      - name: Attempt test without pre-installation
        id: test-attempt
        shell: C:\msys64\usr\bin\bash.exe -e {0}
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: 1
          http_proxy: http://proxy-dmz.intel.com:912
          https_proxy: http://proxy-dmz.intel.com:912
        continue-on-error: true
        run: |
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          echo "=== Attempting to run CI with available tools ==="
          echo "Current working directory: $(pwd)"
          echo ""
          # Try to run the basic build requirements check
          echo "Running gg_check_build_requirements..."
          bash ./ci/run.sh ./results/llama.cpp ./mnt/llama.cpp 2>&1 | head -n 100
