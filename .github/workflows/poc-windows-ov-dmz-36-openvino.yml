# Windows self-hosted runner ov-dmz-36
# Builds the OpenVINO backend and runs the main ctest set.
name: PoC Windows OpenVINO (ov-dmz-36)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-windows-ov-dmz-36-openvino.yml'

permissions:
  contents: read

jobs:
  windows-openvino:
    runs-on: [self-hosted, X64, Windows, ov-dmz-36]
    env:
      http_proxy: http://proxy-dmz.intel.com:911
      https_proxy: http://proxy-dmz.intel.com:912
      no_proxy: localhost,127.0.0.1

    steps:
      - name: Clone Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup OpenVINO Toolkit
        uses: ./.github/actions/windows-setup-openvino
        with:
          path: ./openvino_toolkit
          version_major: "2026.4.1"
          version_full: "2026.4.1.22982.07f9c262b05"

      - name: Check Visual Studio
        shell: cmd
        continue-on-error: true
        run: |
          where cl
          cmake --version
          where ninja
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -all -products *

      - name: Install OpenCL using vcpkg
        shell: cmd
        run: |
          rem TEMP: let vcpkg's curl trust the proxy CA (MSYS2 bundle) until the host trusts it
          dir /s /b C:\msys64\etc\pki
          dir /b C:\msys64\usr\ssl\certs
          set CURL_CA_BUNDLE=C:\msys64\etc\pki\ca-trust\extracted\pem\tls-ca-bundle.pem
          if not exist %CURL_CA_BUNDLE% (
            echo CA bundle not found: %CURL_CA_BUNDLE%
            exit /b 1
          )
          if not exist C:\vcpkg\vcpkg.exe (
            git clone https://github.com/microsoft/vcpkg C:\vcpkg || exit /b 1
            call C:\vcpkg\bootstrap-vcpkg.bat || exit /b 1
          )
          C:\vcpkg\vcpkg install opencl || exit /b 1

      - name: Build and test
        shell: cmd
        run: |
          for /d %%i in (openvino_toolkit\*) do call "%%i\setupvars.bat"
          set GGML_OPENVINO_DEVICE=GPU
          cmake -B build\ReleaseOV -G "Visual Studio 18 2026" -A x64 -DGGML_OPENVINO=ON -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake || exit /b 1
          cmake --build build\ReleaseOV --config Release -- /m || exit /b 1
          ctest --test-dir build\ReleaseOV -L main -E "test-llama-archs|^test-recurrent-state-|test-save-load-state" -C Release --timeout 3000 --no-tests=error || exit /b 1
