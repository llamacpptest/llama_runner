# Windows self-hosted runner ov-dmz-36
# Builds the OpenVINO backend and runs the main ctest set.
name: PoC Windows OpenVINO (ov-dmz-36)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-windows-ov-dmz-36-openvino.yml'

permissions:
  contents: read

jobs:
  windows-openvino:
    runs-on: [self-hosted, X64, Windows, ov-dmz-36]
    env:
      http_proxy: http://proxy-dmz.intel.com:911
      https_proxy: http://proxy-dmz.intel.com:912
      no_proxy: localhost,127.0.0.1

    steps:
      - name: Clone Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup OpenVINO Toolkit
        uses: ./.github/actions/windows-setup-openvino
        with:
          path: ./openvino_toolkit
          version_major: "2026.4.1"
          version_full: "2026.4.1.22982.07f9c262b05"

      - name: Check Visual Studio
        shell: cmd
        continue-on-error: true
        run: |
          where cl
          cmake --version
          where ninja
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -all -products *

      - name: Build OpenCL (headers + ICD loader)
        shell: cmd
        run: |
          if not exist C:\opencl\install\lib\OpenCL.lib (
            git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers C:\opencl\headers || exit /b 1
            git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader C:\opencl\loader || exit /b 1
            cmake -S C:\opencl\headers -B C:\opencl\headers\build -DCMAKE_INSTALL_PREFIX=C:\opencl\install || exit /b 1
            cmake --build C:\opencl\headers\build --target install || exit /b 1
            cmake -S C:\opencl\loader -B C:\opencl\loader\build -A x64 -DOPENCL_ICD_LOADER_HEADERS_DIR=C:\opencl\headers -DCMAKE_INSTALL_PREFIX=C:\opencl\install -DBUILD_TESTING=OFF || exit /b 1
            cmake --build C:\opencl\loader\build --config Release --target install || exit /b 1
          )

      - name: Build and test
        shell: cmd
        run: |
          for /d %%i in (openvino_toolkit\*) do call "%%i\setupvars.bat"
          set GGML_OPENVINO_DEVICE=GPU
          cmake -B build\ReleaseOV -G "Visual Studio 18 2026" -A x64 -DGGML_OPENVINO=ON -DOpenCL_INCLUDE_DIR=C:\opencl\install\include -DOpenCL_LIBRARY=C:\opencl\install\lib\OpenCL.lib || exit /b 1
          cmake --build build\ReleaseOV --config Release -- /m || exit /b 1
          ctest --test-dir build\ReleaseOV -L main -E "test-llama-archs|^test-recurrent-state-|test-save-load-state" -C Release --timeout 3000 --no-tests=error || exit /b 1
