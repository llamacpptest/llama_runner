# Minimalist PoC probe for Windows self-hosted runner ov-dmz-36
# Tests basic system info, GPU, and toolchain availability
# No package installation, no proxy configuration
name: PoC Windows probe (ov-dmz-36) - Minimal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/poc-windows-ov-dmz-36.yml'

permissions:
  contents: read

jobs:
  windows-probe:
    runs-on: [self-hosted, X64, Windows, ov-dmz-36]

    steps:
      - name: Disable SSL verification for GitHub REST API download
        shell: powershell
        run: |
          [System.Net.ServicePointManager]::ServerCertificateValidationCallback = { $true }
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12

      - name: Clone Repository
        id: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Host + OS Information
        shell: powershell
        run: |
          Write-Host "=== System Information ==="
          Write-Host "Hostname: $env:COMPUTERNAME"
          (Get-CimInstance Win32_OperatingSystem).Caption
          (Get-CimInstance Win32_OperatingSystem).Version
          Write-Host ""

      - name: CPU Information
        shell: powershell
        run: |
          Write-Host "=== CPU Information ==="
          Get-CimInstance Win32_Processor |
            Select-Object Name, Cores, Threads, MaxClockSpeed |
            Format-Table -AutoSize

      - name: Memory Information
        shell: powershell
        run: |
          Write-Host "=== Memory Information ==="
          $totalMem = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB
          Write-Host "Total RAM: $([math]::Round($totalMem, 2)) GB"

      - name: GPU Information
        shell: powershell
        run: |
          Write-Host "=== GPU Information ==="
          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion, AdapterRAM |
            Format-Table -AutoSize

      - name: Disk Information
        shell: powershell
        run: |
          Write-Host "=== Disk Information ==="
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, Used, Free |
            Format-Table -AutoSize

      - name: Check for Common Tools
        shell: powershell
        run: |
          Write-Host "=== Checking Available Tools ==="
          $tools = @("git", "python", "cmake", "ninja", "vulkaninfo")
          
          foreach ($tool in $tools) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host "[FOUND]   : $tool -> $($cmd.Source)"
            } else {
              Write-Host "[MISSING] : $tool"
            }
          }

      - name: Check MSYS2 Shell
        shell: powershell
        run: |
          Write-Host "=== MSYS2 Availability ==="
          if (Test-Path "C:\msys64\usr\bin\bash.exe") {
            Write-Host "[FOUND]   : MSYS2 bash.exe at C:\msys64\usr\bin\bash.exe"
          } else {
            Write-Host "[MISSING] : MSYS2 bash.exe"
          }

      - name: Test Basic Bash Command
        shell: C:\msys64\usr\bin\bash.exe -e {0}
        continue-on-error: true
        run: |
          echo "=== MSYS2 Bash Environment ==="
          echo "Shell: $SHELL"
          echo "User: $(whoami)"
          echo "Current directory: $(pwd)"
          echo ""
          echo "=== PATH ==="
          echo $PATH

      - name: Export Windows root CAs for MSYS2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $seen = @{}
          $sb = New-Object System.Text.StringBuilder
          foreach ($store in 'Cert:\LocalMachine\Root', 'Cert:\CurrentUser\Root') {
            foreach ($c in Get-ChildItem $store) {
              if ($seen.ContainsKey($c.Thumbprint)) { continue }
              $seen[$c.Thumbprint] = $true
              [void]$sb.AppendLine('-----BEGIN CERTIFICATE-----')
              [void]$sb.AppendLine([Convert]::ToBase64String($c.RawData, 'InsertLineBreaks'))
              [void]$sb.AppendLine('-----END CERTIFICATE-----')
            }
          }
          foreach ($dir in 'C:\msys64\etc\pki\ca-trust\source\anchors',
                           'C:\msys64\mingw64\etc\pki\ca-trust\source\anchors') {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            [IO.File]::WriteAllText((Join-Path $dir 'windows-root-cas.pem'), $sb.ToString(), (New-Object Text.ASCIIEncoding))
          }

      - name: Run actual test
        shell: C:\msys64\usr\bin\bash.exe -e {0}
        run: |
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          export no_proxy=localhost,127.0.0.1
          export ftp_proxy=http://proxy-mu.intel.com:911
          export https_proxy=http://proxy-dmz.intel.com:912
          export socks_proxy=proxy-mu.intel.com:1080
          export http_proxy=http://proxy-dmz.intel.com:911
          export CFLAGS="-D_WIN32_WINNT=0x0A00"
          export CXXFLAGS="-D_WIN32_WINNT=0x0A00"
          /usr/bin/update-ca-trust
          LLAMA_FATAL_WARNINGS=OFF GG_BUILD_NINJA=1 GG_BUILD_VULKAN=1 GG_BUILD_LOW_PERF=1 \
            bash ./ci/run.sh ./results/llama.cpp ./mnt/llama.cpp

      - name: Repository Information
        shell: bash
        run: |
          echo "=== Repository Information ==="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Files in repo:"
          ls -la | head -20

      - name: Summary Report
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=== PROBE SUMMARY ==="
          Write-Host "Runner: ov-dmz-36"
          Write-Host "Status: All basic checks completed"
          Write-Host "Next: Review logs to determine what needs to be installed"
